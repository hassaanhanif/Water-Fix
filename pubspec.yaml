name: waterfix_mobile
description: "WaterFix - On-Demand Water Tanker Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  intl: ^0.20.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3

dependency_overrides:
  shared_preferences_android: 2.4.7
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "waterfix-logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "waterfix-logo.png"

flutter:
  uses-material-design: true
